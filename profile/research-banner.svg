<svg xmlns="http://www.w3.org/2000/svg" width="840" height="158" viewBox="0 0 840 158" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">AI Research &amp; Engineering</title>
  <desc id="banner-description">A navy banner with three overlapping colored orbits.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="840" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102133"/>
      <stop offset=".58" stop-color="#0C1D2E"/>
      <stop offset="1" stop-color="#162A3F"/>
    </linearGradient>
    <radialGradient id="glow" cx="709" cy="79" r="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#459AAB" stop-opacity=".22"/>
      <stop offset="1" stop-color="#459AAB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".64" fill="#B5DDF9"/>
    </pattern>
    <clipPath id="banner-shape">
