      <ellipse cx="704" cy="79" rx="89" ry="37" stroke="#70D1C9" transform="rotate(24 704 79)"/>
      <ellipse cx="704" cy="79" rx="64" ry="37" stroke="#BBC2FF" stroke-opacity=".78" transform="rotate(90 704 79)"/>
    </g>
    <circle cx="704" cy="79" r="7" fill="#A0DFEE" opacity=".13"/>
    <circle cx="704" cy="79" r="3.5" fill="#D3FBF6"/>
    <circle cx="625" cy="103" r="4" fill="#9BCFFF"/>
    <circle cx="784" cy="105" r="4" fill="#83DFD5"/>
    <circle cx="704" cy="15" r="3.5" fill="#C5C8FF"/>
