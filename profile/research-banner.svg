    <rect x="495" width="345" height="158" fill="url(#glow)"/>
    <path d="M540 0H840V158H520Z" fill="url(#dots)" opacity=".13"/>
    <path d="M590 79H820M704 15V143" fill="none" stroke="#90ACBF" stroke-opacity=".22" stroke-dasharray="2 5"/>
    <g fill="none" stroke-width="1.4">
